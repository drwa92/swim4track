name: Python contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Regular installation exercises wheel packaging, including the model asset.
      - run: python -m pip install '.[viz]'
      - run: python -m unittest discover -s tests -v
      - run: python -m swim4track.policy
        working-directory: /tmp
      - run: python -m swim4track.demo --controller pid --seconds 2 --output runs/ci_pid --plot
      - run: bash -n scripts/*.sh
      - run: python -m compileall -q src ros2
  inference-and-training-startup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[train]'
      # Explicitly require inference so a skipped optional unittest cannot pass this job.
      - run: python -m swim4track.policy --load
        working-directory: /tmp
      - run: python -m unittest discover -s tests -v
      - run: python -m swim4track.demo --controller learned --seconds 2 --output runs/ci_learned
      # Startup/step/save check only; below learning_starts and not a training result.
      - run: python -m swim4track.train --steps 32 --envs 1 --device cpu --output runs/ci_train_startup
